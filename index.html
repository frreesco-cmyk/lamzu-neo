<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lamzu Neo — Каталог</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0b14;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 90px;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        .badge-brand {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(192, 132, 252, 0.3);
        }

        .badge-city {
            background: rgba(255, 255, 255, 0.07);
            color: #e2e8f0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px 16px 12px 42px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: #c084fc;
            box-shadow: 0 0 10px rgba(192, 132, 252, 0.2);
        }

        .search-box svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: #94a3b8;
        }

        .profiles-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
        }

        .card-img-placeholder {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #1e1b2e 0%, #2a2438 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 14px;
            position: relative;
        }

        .status-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-free {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.4);
        }

        .card-body {
            padding: 16px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #f8fafc;
        }

        .card-info {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .card-prices {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .price-item span {
            display: block;
            font-size: 11px;
            color: #64748b;
        }

        .price-item strong {
            color: #e2e8f0;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            margin-top: 50px;
            font-size: 15px;
        }

        .nav-bar {
            position: fixed;
            bottom: 12px;
            left: 16px;
            right: 16px;
            background: rgba(26, 22, 37, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-item {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 8px 24px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-item.active {
            background: rgba(192, 132, 252, 0.15);
            color: #c084fc;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="badge-brand">✨ LAMZU NEO</div>
        <div class="badge-city" id="selected-city">📍 Все города</div>
    </div>

    <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="search-input" placeholder="Поиск по имени или городу..." oninput="filterProfiles()">
    </div>

    <div id="profiles-container" class="profiles-grid">
        <div class="empty-state">Загрузка анкет...</div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('home', event)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </button>
        <button class="nav-item" onclick="switchTab('profile', event)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let allProfiles = [];

        function loadProfiles() {
            try {
                // Достаем сохраненные анкеты из памяти браузера
                let stored = localStorage.getItem('lamzu_profiles');
                allProfiles = stored ? JSON.parse(stored) : [];
                renderProfiles(allProfiles);
            } catch (e) {
                console.error("Ошибка загрузки:", e);
                document.getElementById('profiles-container').innerHTML = `<div class="empty-state">Ошибка чтения данных.</div>`;
            }
        }

        function renderProfiles(profiles) {
            let container = document.getElementById('profiles-container');
            
            if (!profiles || profiles.length === 0) {
                container.innerHTML = `<div class="empty-state">Пока нет добавленных анкет.<br>Создайте её через бота!</div>`;
                return;
            }

            container.innerHTML = '';
            profiles.forEach(p => {
                container.innerHTML += `
                    <div class="profile-card">
                        <div class="card-img-placeholder">
                            <span>📷 Фотографий: ${p.photosCount || 3}</span>
                            <div class="status-badge status-free">${p.status || '🟢 Свободна'}</div>
                        </div>
                        <div class="card-body">
                            <div class="card-title">${p.name}, ${p.age}</div>
                            <div class="card-info">📍 ${p.city} • 📏 ${p.height} см / ${p.weight} кг</div>
                            <div class="card-prices">
                                <div class="price-item">
                                    <span>1 час</span>
                                    <strong>${p.price_1h} ₽</strong>
                                </div>
                                <div class="price-item">
                                    <span>3 часа</span>
                                    <strong>${p.price_3h} ₽</strong>
                                </div>
                                <div class="price-item">
                                    <span>Ночь</span>
                                    <strong>${p.price_night} ₽</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterProfiles() {
            let query = document.getElementById('search-input').value.toLowerCase();
            let filtered = allProfiles.filter(p => 
                p.name.toLowerCase().includes(query) || p.city.toLowerCase().includes(query)
            );
            renderProfiles(filtered);
        }

        function switchTab(tab, event) {
            let items = document.querySelectorAll('.nav-item');
            items.forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            if(tab === 'profile') {
                tg.showAlert("Управлять своей анкетой и менять статус можно в боте через кнопку «👤 Моя анкета».");
            }
        }

        loadProfiles();
        // Автообновление каждые 2 секунды на случай изменения данных
        setInterval(loadProfiles, 2000);
    </script>
</body>
</html>
